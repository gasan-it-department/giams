[workspace]
resolver = "2"
members = [
    "server/crates/domain",
    "server/crates/db",
    "server/crates/api",
    "server/crates/sync",
    "cloud",
    "server/crates/licence",
    "server/crates/reports",
    "server/crates/server",
    "desktop",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "Proprietary"
authors    = ["Municipality of Gasan IT Team"]
repository = "https://github.com/gasan-lgu/giams"

# ── Shared dependency versions ────────────────────────────────────────────────
# Pinned at the workspace so every crate agrees. Money always travels as
# rust_decimal::Decimal — see docs/ARCHITECTURE.md §5.1. Never f32/f64.
[workspace.dependencies]
giams-domain  = { path = "server/crates/domain" }
giams-db      = { path = "server/crates/db" }
giams-api     = { path = "server/crates/api" }
giams-reports = { path = "server/crates/reports" }
giams-sync    = { path = "server/crates/sync" }
giams-licence = { path = "server/crates/licence" }

anyhow             = "1"
argon2             = { version = "0.5", features = ["std"] }
axum               = "0.8"
base64             = "0.22"
ed25519-dalek      = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand               = "0.8"
subtle             = "2"
chrono             = { version = "0.4", features = ["serde"] }
dotenvy            = "0.15"
jsonwebtoken       = "9"
rust_decimal       = { version = "1", features = ["serde-with-str", "db-postgres"] }
rust_decimal_macros = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
sha2               = "0.10"
sqlx               = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls", "postgres", "macros", "migrate",
    "chrono", "uuid", "rust_decimal", "json",
] }
thiserror          = "2"
tokio              = { version = "1", features = ["full"] }
tower-http         = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid               = { version = "1", features = ["v4", "v7", "serde"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
