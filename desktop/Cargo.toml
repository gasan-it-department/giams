[package]
name    = "giams-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "GIAMS desktop client for the Municipal Accounting Office"

[[bin]]
name = "giams"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri   = { version = "2", features = [] }
# Windows Credential Manager (DPAPI) on Windows, Keychain on macOS, Secret
# Service on Linux. Used directly rather than through a plugin: the surface we
# need is three calls, and the refresh token is the one secret that touches
# disk, so it is worth keeping that path short and legible.
#
# The platform backend must be selected explicitly. Without one of these
# features keyring falls back to an in-memory mock, which silently does
# nothing on disk -- the failure mode is a user who is quietly signed out
# every time the application restarts.
keyring = { version = "3", features = [
    "windows-native",
    "apple-native",
    "sync-secret-service",
] }
serde   = { workspace = true }
serde_json = { workspace = true }
base64  = { workspace = true }
rand    = { workspace = true }
# Plain bundled SQLite. SQLCipher was the first choice, but its build needs
# OpenSSL, which on Windows MSVC drags in native Perl and NASM — three extra
# toolchains for whoever maintains this after handover. The draft contents are
# encrypted at the field level instead (see src/drafts.rs), which covers the
# actual disclosure risk with a pure-Rust dependency.
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm  = "0.10"
tracing = { workspace = true }
mdns-sd = "0.21.0"
